name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Lint & secret check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax lint
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" || status=1
          done < <(find . -name '*.php' -not -path './public/tfm/*' -not -path './.git/*' -print0)
          exit $status

      - name: Check for hardcoded secrets
        run: |
          set -e
          if grep -rnEi "\b(api[_-]?key|apikey|secret|passwd|password|pass|token)\b[[:space:]]*=[[:space:]]*['\"][^'\"]{6,}['\"]" \
              --include='*.php' --exclude-dir=public --exclude-dir=.git .; then
            echo "::error::Possible hardcoded credential found above (matched above). Use env('KEY') from env.php / a repository secret instead — see .env.example."
            exit 1
          fi
          echo "No hardcoded credential pattern found."

  deploy:
    name: Deploy to InfinityFree
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # env.php reads .env at runtime (db.php, audio-to-text.php). This file
      # is never committed — it's generated here from repository secrets and
      # only exists on the runner for the duration of this job. .htaccess
      # denies direct web access to it once deployed.
      - name: Write production .env
        run: |
          cat > .env <<EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          ASSEMBLYAI_API_KEY=${{ secrets.ASSEMBLYAI_API_KEY }}
          EOF

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          state-name: .ftp-deploy-sync-state.json

      - name: Post-deploy smoke check
        run: |
          set -e
          urls=(
            "https://ailearner.free.nf/"
            "https://ailearner.free.nf/signin"
            "https://ailearner.free.nf/contact"
            "https://ailearner.free.nf/ai-course"
          )
          fail=0
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code"
              fail=1
            fi
          done
          exit $fail
